# The end-to-end fixture of angzarr-build's tests/local.rs: an application on
# angzarr-local (angzarr-embedded), its domain layer and register() generated from the
# buy-in fixture protos, its components the scaffold with bodies written.
# Built and run by that test only; a workspace of its own, outside
# angzarr-cli's.
[package]
name = "buyin-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# angzarr-embedded and angzarr-router at the revs the POC lands on. Both are
# placeholders until angzarr-embedded step 2 (angzarr-ports) and angzarr-embedded dispatching
# through the router land: re-pin here then (the test that builds this is
# ignored until it can pass).
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "02b876dd525c5d78c7395fb40631b9e7f21193b1" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "02b876dd525c5d78c7395fb40631b9e7f21193b1" }
angzarr-embedded-diagnostic = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "02b876dd525c5d78c7395fb40631b9e7f21193b1" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "70528f0b2de4a2de812886ea90aebb483ed47f75" }
prost = "0.14"

[build-dependencies]
angzarr-build = { path = "../../.." }
