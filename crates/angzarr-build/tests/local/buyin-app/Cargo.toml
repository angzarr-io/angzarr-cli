# The end-to-end fixture of angzarr-build's tests/local.rs: an application on
# angzarr-local (annals), its domain layer and register() generated from the
# buy-in fixture protos, its components the scaffold with bodies written.
# Built and run by that test only; a workspace of its own, outside
# angzarr-cli's.
[package]
name = "buyin-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# annals and angzarr-router at the revs the POC lands on. Both are
# placeholders until annals step 2 (angzarr-ports) and annals dispatching
# through the router land: re-pin here then (the test that builds this is
# ignored until it can pass).
[dependencies]
annals = { git = "https://github.com/benjaminabbitt/annals", rev = "aa11c8c117fa756f05a4e88c5376c28e47ccc4fe" }
annals-macros = { git = "https://github.com/benjaminabbitt/annals", rev = "aa11c8c117fa756f05a4e88c5376c28e47ccc4fe" }
annals-diagnostic = { git = "https://github.com/benjaminabbitt/annals", rev = "aa11c8c117fa756f05a4e88c5376c28e47ccc4fe" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "70528f0b2de4a2de812886ea90aebb483ed47f75" }
prost = "0.14"

[build-dependencies]
angzarr-build = { path = "../../.." }
