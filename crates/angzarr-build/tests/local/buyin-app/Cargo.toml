# The end-to-end fixture of angzarr-build's tests/local.rs: an application on
# angzarr-embedded, its domain layer and register() generated from the
# buy-in fixture protos, its components the scaffold with bodies written,
# run by angzarr-embedded-host from angzarr.toml beside this file. Built and
# run by that test only; a workspace of its own, outside angzarr-cli's. Its
# Cargo.lock is a build artifact, ignored.
[package]
name = "buyin-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# angzarr-embedded at the rev that dispatches through angzarr-router and has
# its entry point (angzarr-embedded-host's `run`), and the router at the rev
# it names, so the app has one router and one angzarr-proto (angzarr core's,
# at the rev angzarr-embedded and angzarr-cli both pin).
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "5265e5cd51701f236d1cde87124a89274d16fd79" }
angzarr-embedded-host = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "5265e5cd51701f236d1cde87124a89274d16fd79" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "5265e5cd51701f236d1cde87124a89274d16fd79" }
angzarr-embedded-diagnostic = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "5265e5cd51701f236d1cde87124a89274d16fd79" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "d83c85460c662f35ff4f888e77004267c5054c2a" }
prost = "0.14"
# The App is async, on the caller's runtime, which is tokio's
# (angzarr-embedded-host), already in the graph through it.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
angzarr-build = { path = "../../.." }
