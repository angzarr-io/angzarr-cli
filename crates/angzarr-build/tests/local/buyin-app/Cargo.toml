# The end-to-end fixture of angzarr-build's tests/local.rs: an application on
# angzarr-embedded, its domain layer and register() generated from the
# buy-in fixture protos, its components the scaffold with bodies written,
# run by angzarr-embedded-host from angzarr.toml beside this file. Built and
# run by that test only; a workspace of its own, outside angzarr-cli's. Its
# Cargo.lock is a build artifact, ignored.
[package]
name = "buyin-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# angzarr-embedded at the rev that dispatches through angzarr-router and has
# its entry point (angzarr-embedded-host's `run`), and the router at the rev
# it names, so the app has one router and one angzarr-proto (55eab0f,
# angzarr-embedded's).
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "0e4c2dab2db95989bb42a9718cf4445f035cc234" }
angzarr-embedded-host = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "0e4c2dab2db95989bb42a9718cf4445f035cc234" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "0e4c2dab2db95989bb42a9718cf4445f035cc234" }
angzarr-embedded-diagnostic = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "0e4c2dab2db95989bb42a9718cf4445f035cc234" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "bc870aa2fd2bc3592d4e999d314a0f8cb30ad9c2" }
prost = "0.14"

[build-dependencies]
angzarr-build = { path = "../../.." }
