# The end-to-end fixture of angzarr-build's tests/local.rs: an application on
# angzarr-embedded, its domain layer and register() generated from the
# buy-in fixture protos, its components the scaffold with bodies written,
# run by angzarr-embedded-host from angzarr.toml beside this file. Built and
# run by that test only; a workspace of its own, outside angzarr-cli's. Its
# Cargo.lock is a build artifact, ignored.
[package]
name = "buyin-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# angzarr-embedded at the rev that dispatches through angzarr-router and has
# its entry point (angzarr-embedded-host's `run`), and the router at the rev
# it names, so the app has one router and one angzarr-proto (a1293ea,
# angzarr-embedded's).
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
angzarr-embedded-host = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
angzarr-embedded-diagnostic = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "3b1ad294d1a67ec94e90282c76b8a4eca40e13ab" }
prost = "0.14"

[build-dependencies]
angzarr-build = { path = "../../.." }
