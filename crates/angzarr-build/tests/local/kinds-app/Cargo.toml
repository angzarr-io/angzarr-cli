# The end-to-end fixture of angzarr-build's tests/local.rs: an application on
# angzarr-embedded, its domain layer and register() generated from the
# kinds fixture proto (a typed refusal of each field kind, a command
# refusing several, each emits cardinality, a projector of two domains),
# its components the scaffold with their bodies written, and a projector
# written by hand beside them, run by angzarr-embedded-host.
# Built and run by that test only; a workspace of its own, outside
# angzarr-cli's. Its Cargo.lock is a build artifact, ignored.
[package]
name = "kinds-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# angzarr-embedded at the rev that dispatches through angzarr-router and has
# its entry point (angzarr-embedded-host's `run`), and the router at the rev
# it names, so the app has one router and one angzarr-proto (angzarr core's,
# at the rev angzarr-embedded and angzarr-cli both pin).
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "e98071f6d9b74539172eb03af63146159b6b4450" }
angzarr-embedded-host = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "e98071f6d9b74539172eb03af63146159b6b4450" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "e98071f6d9b74539172eb03af63146159b6b4450" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "152e18197b3ddf0fc7c06f7ba4ca0a401084921d" }
prost = "0.14"
# The App is async, on the caller's runtime, which is tokio's
# (angzarr-embedded-host), already in the graph through it.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
angzarr-build = { path = "../../.." }
