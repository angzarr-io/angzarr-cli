# The end-to-end fixture of angzarr-build's tests/local.rs: an application on
# angzarr-embedded, its domain layer and register() generated from the
# kinds fixture proto (a typed refusal of each field kind, a command
# refusing several), its component the scaffold with its body written.
# Built and run by that test only; a workspace of its own, outside
# angzarr-cli's. Its Cargo.lock is a build artifact, ignored.
[package]
name = "kinds-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# angzarr-embedded at the rev that dispatches through angzarr-router and has
# its entry point (angzarr-embedded-host's `run`), and the router at the rev
# it names, so the app has one router and one angzarr-proto (angzarr core's,
# at the rev angzarr-embedded and angzarr-cli both pin).
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "7c0a8bb904c202d18356d9627db8f37b54fc50bc" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "7c0a8bb904c202d18356d9627db8f37b54fc50bc" }
angzarr-embedded-diagnostic = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "7c0a8bb904c202d18356d9627db8f37b54fc50bc" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "d83c85460c662f35ff4f888e77004267c5054c2a" }
prost = "0.14"

[build-dependencies]
angzarr-build = { path = "../../.." }
