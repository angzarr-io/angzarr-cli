# The kinds app's config: every component in process, each listed (the
# generated ones by their component names, the hand-written projector by
# its own), the store in memory.
schema_version: 1
component:
  - name: ledger
    language: rust
    kind: domain
  - name: audit
    language: rust
    kind: domain
  - name: policy-ledger-audit
    language: rust
    kind: policy
  - name: projector-ledger-view
    language: rust
    kind: projector
  - name: projector-tally
    language: rust
    kind: projector
store:
  in_memory: true
