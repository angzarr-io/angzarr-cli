[package]
name = "angzarr-fmt"
version = "0.1.0"
description = "CLI output: one result, rendered as json or text; localizable failures."
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Knows nothing about angzarr and nothing about any argument parser.
[dependencies]
angzarr-diagnostic.workspace = true
fluent-bundle.workspace = true
fluent-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
unic-langid.workspace = true

# The build writes the catalog's source under the crate's name
# (angzarr_diagnostic::build): no catalog spells its crate's name.
[build-dependencies]
angzarr-diagnostic = { workspace = true, features = ["build"] }

[lints]
workspace = true
