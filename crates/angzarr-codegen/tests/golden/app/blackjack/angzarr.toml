# The host config of blackjack: every component, its kind, the language it
# is written in and, for one served by a child process, how it is
# launched. Written once by `angzarr scaffold app` and yours from then
# on: each run regenerates build.rs and src/main.rs from it, main.rs
# registering the in-process components it lists, and `angzarr lint
# app` checks it against the protos.

[[component]]
name = "table"
kind = "domain"
language = "rust"

[[component]]
name = "player"
kind = "domain"
language = "python"
dir = "player"
entry = ["angzarr-player"]

[[component]]
name = "policy-table-player"
kind = "policy"
language = "rust"

[[component]]
name = "policy-player-table"
kind = "policy"
language = "rust"

[store]
in_memory = true
