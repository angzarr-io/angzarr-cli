# blackjack on angzarr-embedded. Written once by `angzarr scaffold startup`
# and yours from then on.

[package]
name = "blackjack"
version = "0.1.0"
edition = "2024"
publish = false

# angzarr-embedded, its markup and its host, at the commit this angzarr CLI
# generates for; the generated domain layer needs prost.
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "4fef59dd95f4c00d75d6f42248021a72f5ea70e0" }
angzarr-embedded-diagnostic = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "4fef59dd95f4c00d75d6f42248021a72f5ea70e0" }
angzarr-embedded-host = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "4fef59dd95f4c00d75d6f42248021a72f5ea70e0" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "4fef59dd95f4c00d75d6f42248021a72f5ea70e0" }
prost = "0.14"

[build-dependencies]
angzarr-build = { git = "https://github.com/angzarr-io/angzarr-cli", rev = "c1898ae" }
