# angzarr-embedded's host configuration for blackjack: every domain, the
# language it is written in and, for one served by a child process, how it
# is launched (its language's default launch, then its entry; `launch`
# replaces both). Written once by `angzarr scaffold startup` and yours from
# then on; `angzarr lint startup` checks it against the protos.

[[domain]]
name = "table"
language = "rust"

[[domain]]
name = "player"
language = "python"
dir = "player"
entry = ["angzarr-player"]

[store]
# SQLite, created when absent, relative to the working directory;
# `in_memory = true` keeps nothing on disk.
path = "angzarr.db"

[policy]
# What a policy step that hits a bug (the policy's own error, or a handler's
# bug in its step) does with the policy's position once the step is
# dead-lettered: "move_past" the trigger (the dead letter is the record to
# replay) or "stay" at it, so a resume runs the step again.
on_bug = "move_past"
