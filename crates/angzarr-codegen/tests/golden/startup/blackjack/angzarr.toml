# angzarr-embedded's host configuration for blackjack: every domain, the
# language it is written in and, for one served by a child process, how it
# is launched (its language's default launch, then its entry; `launch`
# replaces both). Written once by `angzarr scaffold startup` and yours from
# then on; `angzarr lint startup` checks it against the protos.

[[domain]]
name = "table"
language = "rust"

[[domain]]
name = "player"
language = "python"
dir = "player"
entry = ["angzarr-player"]
