// A command refusing with a typed refusal whose nested enum lists the
// rejection codes, as table.proto would declare its eighteen if the owner
// rules for that shape (red/table-generation): the generated diagnostic
// carries each field as an arg, an enum as its value's name without the
// enum's prefix (`ALREADY_BET`, the ErrorInfo.reason on the wire).
syntax = "proto3";
package refusals.v1;
import "io/angzarr/v1/options.proto";

message SeatState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "seats"
  };
  int64 stack = 1;
}

message PlaceBet {
  option (io.angzarr.v1.command) = {
    component: "refusals.v1.SeatState"
    emits: "refusals.v1.BetPlaced"
    refuses: "refusals.v1.BetRefused"
  };
  int64 amount = 1;
}

message BetPlaced {
  option (io.angzarr.v1.event) = {component: "refusals.v1.SeatState"};
  int64 amount = 1;
}

message BetRefused {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_ALREADY_BET = 1;
    REASON_BET_OUT_OF_RANGE = 2;
  }
  Reason reason = 1;
  int64 max_bet = 2;
}
