syntax = "proto3";

// The two policies (the spec's stateless sagas, declared as SAGA until the
// spec's rename lands): one per (source domain, target domain) pair, each on
// an empty marker message. Their events are wired by the (event) entries on
// the events they consume.
package buyin.v1;

import "io/angzarr/v1/options.proto";

// A started buy-in holds its stake on the wallet it names.
message BuyInWalletPolicy {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "buyin"
    output_domain: "wallet"
    name: "BuyInWallet"
  };
}

// A hold on the wallet is recorded on the buy-in of its correlation.
message WalletBuyInPolicy {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "wallet"
    output_domain: "buyin"
    name: "WalletBuyIn"
  };
}
