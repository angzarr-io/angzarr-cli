# The framework's reason-key catalog (decisions 14.37 and 14.42).
#
# One entry per key: the component that answers it (`router`: the client
# library's router, in every language; `coordinator`: core's coordinator
# and the angzarr-embedded kernel), the gRPC status it travels with, and
# the names of its args (the ErrorInfo metadata keys). A key that never
# travels as a status but is a readiness refusal (logged and alerted, see
# component.proto) has `status = "READINESS"`. `cause` args flatten a
# wrapped key and its args as `cause` and `cause.<arg>` (types.proto, the
# diagnostic region).
#
# Each language's constants are generated from this file; nothing else
# defines a framework key. Which class a status is (decision 14.37's four
# classes) is the coordinator's to decide, not listed here. English for a
# key comes from a Fluent catalog keyed by it, never from this file.
#
# `scripts/check_reasons.py` (in `just contracts`) checks the file's shape
# and that no retired key is named in the features or protos.

# --- answered by the router -------------------------------------------------

[keys.UNHANDLED_HANDLER_ERROR]
owner = "router"
status = "INTERNAL"   # or the retryable status a handler picks (C-0678)
args = ["cause"]

[keys.HANDLER_PANICKED]
owner = "router"
status = "INTERNAL"   # travels only as UNHANDLED_HANDLER_ERROR's cause
args = []

[keys.COMMAND_REFUSED]
owner = "router"
status = "FAILED_PRECONDITION"
args = ["refusal_type"]

[keys.FOLD_FAILED]
owner = "router"
status = "INTERNAL"
args = ["sequence", "type_url", "first_sequence", "last_sequence", "state_type_url", "cause"]

[keys.FOLD_FAILED_EMITTED]
owner = "router"
status = "INTERNAL"
args = ["sequence", "type_url", "first_sequence", "last_sequence", "state_type_url", "cause"]

[keys.PERSISTED_EVENT_CORRUPT]
owner = "router"
status = "INTERNAL"
args = ["type_url"]

[keys.ANY_DECODE_FAILED]
owner = "router"
status = "INTERNAL"
args = ["message_type", "ext_err_txt"]

[keys.UNKNOWN_COMMAND_TYPE]
owner = "router"      # the coordinator relays it with upcast_type_url (14.39)
status = "INTERNAL"
args = ["type_url", "upcast_type_url"]

[keys.NO_FACT_HANDLER]
owner = "router"      # relayed as UNKNOWN_COMMAND_TYPE is
status = "INTERNAL"
args = ["type_url", "upcast_type_url"]

[keys.NO_REFUSAL_HANDLER]
owner = "router"
status = "INTERNAL"
args = ["command_type"]

[keys.CONFLICT_RESOLUTION_UNSUPPORTED]
owner = "router"
status = "INTERNAL"
args = []

[keys.NO_COMPONENT_OF_KIND]
owner = "router"
status = "UNIMPLEMENTED"
args = []

[keys.NO_HANDLERS_REGISTERED]
owner = "router"
status = "INTERNAL"
args = []

[keys.DUPLICATE_COMPONENT]
owner = "router"
status = "INTERNAL"
args = ["component", "component_kind"]

# --- answered by the coordinator --------------------------------------------

[keys.CONFLICT_UNRESOLVED]
owner = "coordinator"
status = "ABORTED"
args = []

[keys.CONFLICT_OVERLAP]
owner = "coordinator"
status = "ABORTED"
args = ["window_units", "command_units"]

[keys.PM_NO_INSTANCE]
owner = "coordinator"
status = "FAILED_PRECONDITION"
args = ["type_url"]

[keys.REFUSAL_FACT_WRONG_STREAM]
owner = "coordinator"
status = "INTERNAL"
args = ["domain"]

[keys.POLICY_COMMAND_OUTSIDE_DESTINATION]
owner = "coordinator"
status = "INTERNAL"
args = ["expected_domain", "actual_domain"]

[keys.POLICY_COMMAND_OUTSIDE_EDITION]
owner = "coordinator"
status = "INTERNAL"
args = ["expected_edition", "actual_edition"]

[keys.POLICY_COMMAND_NO_ROOT]
owner = "coordinator"
status = "INTERNAL"
args = ["domain", "command_type"]

[keys.POLICY_COMMAND_OTHER_CORRELATION]
owner = "coordinator"
status = "INTERNAL"
args = ["domain", "command_type"]

[keys.REFUSAL_FACT_ADDRESSED]
owner = "coordinator"
status = "INTERNAL"
args = []

[keys.REFUSAL_FACT_NO_PAGE]
owner = "coordinator"
status = "INTERNAL"
args = []

[keys.REFUSAL_FACT_NOT_A_FACT]
owner = "coordinator"
status = "INTERNAL"
args = []

[keys.REFUSAL_FACT_IDENTIFIED]
owner = "coordinator"
status = "INTERNAL"
args = []

[keys.MISSING_RULES_VERSION]
owner = "coordinator"
status = "READINESS"
args = ["component"]

[keys.MISSING_STATE_TYPE]
owner = "coordinator"
status = "READINESS"
args = ["component", "component_kind"]

[keys.STARTING_TYPES_ON_NON_PM]
owner = "coordinator"
status = "READINESS"
args = ["component", "component_kind"]

[keys.STATE_ON_STATELESS_KIND]
owner = "coordinator"
status = "READINESS"
args = ["component", "component_kind"]

[keys.POLICY_INPUT_COUNT]
owner = "coordinator"
status = "READINESS"
args = ["component", "input_count"]

[keys.POLICY_NO_OUTPUT_DOMAIN]
owner = "coordinator"
status = "READINESS"
args = ["component"]

[keys.OUTPUT_DOMAIN_ON_NON_POLICY]
owner = "coordinator"
status = "READINESS"
args = ["component", "component_kind"]

# --- retired: never answered again, never reused ------------------------------

[retired]
"14.39" = ["DUPLICATE_UPCASTER_CHAIN", "DUPLICATE_COMMAND_HANDLER"]
"14.42" = [
  "MISSING_COMMAND_BOOK", "MISSING_COMMAND_PAGE", "MISSING_COMMAND_PAYLOAD",
  "MISSING_EVENT_BOOK_COVER", "EMPTY_POLICY_SOURCE",
  "POLICY_SOURCE_OUTSIDE_INPUT_DOMAIN", "REFUSAL_FACT_MISSING",
  "REFUSAL_WITHOUT_COMMAND", "REFUSAL_WITHOUT_EVENT",
  "REFUSAL_WITHOUT_REFUSED_COMMAND", "REFUSED_COMMAND_WITHOUT_ID",
  "REFUSAL_WITHOUT_TRIGGER_STREAM", "HOST_STATUS_UNDECODABLE",
  "NULL_ABI_POINTER",
]
