syntax = "proto3";
package bad.v1;
import "io/angzarr/v1/options.proto";

// A refusal status on the nested Reason of a message no command refuses
// with (decision 14.52): generation fails.
message ThingState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "things"
  };
}

message Poke {
  option (io.angzarr.v1.command) = {
    component: "bad.v1.ThingState"
    emits: ["bad.v1.Poked"]
  };
}

message Poked {
  option (io.angzarr.v1.event) = {component: "bad.v1.ThingState"};
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_GONE = 1 [(io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND];
  }
  Reason reason = 1;
}
