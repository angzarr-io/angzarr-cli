syntax = "proto3";

// A message named as a name the generated domain layer reserves for the
// runtime (its `RetryableStatus`, the status a retryable bug goes out under).
package bad.v1;

import "io/angzarr/v1/options.proto";

message ThingState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "things"
  };
}

message Make {
  option (io.angzarr.v1.command) = {
    component: "bad.v1.ThingState"
    emits: "bad.v1.RetryableStatus"
  };
}

message RetryableStatus {
  option (io.angzarr.v1.event) = {
    component: "bad.v1.ThingState"
  };
}
