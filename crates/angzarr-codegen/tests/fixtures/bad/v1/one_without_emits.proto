syntax = "proto3";
package bad.v1;
import "io/angzarr/v1/options.proto";

message ThingState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "things"
  };
}

// ONE with no emits: only MANY is accepted without emits.
message Poke {
  option (io.angzarr.v1.command) = {
    component: "bad.v1.ThingState"
    emits_cardinality: EMITS_CARDINALITY_ONE
  };
}
