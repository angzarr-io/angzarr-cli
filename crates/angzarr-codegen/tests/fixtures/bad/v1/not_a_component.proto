syntax = "proto3";
package bad.v1;
import "io/angzarr/v1/options.proto";

message ThingState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "things"
  };
}

// A message of the set, but no component.
message Plain {}

message Poke {
  option (io.angzarr.v1.command) = {component: "bad.v1.Plain"};
}
