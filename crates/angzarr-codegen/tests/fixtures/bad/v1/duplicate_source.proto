syntax = "proto3";
package bad.v1;
import "io/angzarr/v1/options.proto";

message ThingState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "things"
  };
}

message Poked {
  option (io.angzarr.v1.event) = {component: "bad.v1.ThingState"};
  option (io.angzarr.v1.event) = {
    component: "bad.v1.ThingView"
    domain: "things"
  };
}

// A source listed twice.
message ThingView {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_PROJECTOR
    input_domains: ["things", "things"]
  };
}
