// Typed refusals of every field kind, a command refusing several of them,
// inputs of each emits cardinality, a projector of two source domains, and
// a policy between the two domains (decision 14.50). Each field set is
// an arg (an integer its number,
// a string itself, an enum its value's name without the enum's prefix,
// bytes their hex, a bool or a float its text), a message, list or map
// field is not, and only a nested Reason enum held as `reason` keys the
// diagnostic by its value.
syntax = "proto3";
package kinds.v1;
import "io/angzarr/v1/options.proto";

message LedgerState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "ledger"
  };
}

message Post {
  option (io.angzarr.v1.command) = {
    component: "kinds.v1.LedgerState"
    emits: "kinds.v1.Posted"
    refuses: "kinds.v1.PostRefused"
    refuses: "kinds.v1.Unreasoned"
    refuses: "kinds.v1.Listed"
    refuses: "kinds.v1.Elsewhere"
    refuses: "kinds.v1.Mislabeled"
  };
}

message Posted {
  option (io.angzarr.v1.event) = {component: "kinds.v1.LedgerState"};
  option (io.angzarr.v1.event) = {
    component: "kinds.v1.LedgerView"
    domain: "ledger"
  };
}

message Noted {
  option (io.angzarr.v1.event) = {component: "kinds.v1.LedgerState"};
  option (io.angzarr.v1.event) = {
    component: "kinds.v1.LedgerAuditPolicy"
    domain: "ledger"
  };
}

// ONE of two types: a tuple.
message Open {
  option (io.angzarr.v1.command) = {
    component: "kinds.v1.LedgerState"
    emits: ["kinds.v1.Posted", "kinds.v1.Noted"]
    emits_cardinality: EMITS_CARDINALITY_ONE
  };
}

// ONE of four types: the widest tuple.
message Four {
  option (io.angzarr.v1.command) = {
    component: "kinds.v1.LedgerState"
    emits: ["kinds.v1.Posted", "kinds.v1.Noted", "kinds.v1.Cleared", "kinds.v1.Closed"]
  };
}

message Cleared {
  option (io.angzarr.v1.event) = {component: "kinds.v1.LedgerState"};
}

message Closed {
  option (io.angzarr.v1.event) = {component: "kinds.v1.LedgerState"};
}

// OPTIONAL of one type.
message Maybe {
  option (io.angzarr.v1.command) = {
    component: "kinds.v1.LedgerState"
    emits: "kinds.v1.Posted"
    emits_cardinality: EMITS_CARDINALITY_OPTIONAL
  };
}

// OPTIONAL of two types: the tuple or nothing.
message MaybeBoth {
  option (io.angzarr.v1.command) = {
    component: "kinds.v1.LedgerState"
    emits: ["kinds.v1.Posted", "kinds.v1.Noted"]
    emits_cardinality: EMITS_CARDINALITY_OPTIONAL
  };
}

// MANY, refusing: each step returns the handler's own failure.
message Batch {
  option (io.angzarr.v1.command) = {
    component: "kinds.v1.LedgerState"
    emits: ["kinds.v1.Posted", "kinds.v1.Noted"]
    refuses: "kinds.v1.PostRefused"
    emits_cardinality: EMITS_CARDINALITY_MANY
  };
}

// No emits and no cardinality: MANY.
message Raw {
  option (io.angzarr.v1.command) = {component: "kinds.v1.LedgerState"};
}

// A fact, OPTIONAL of two types.
message Arrived {
  option (io.angzarr.v1.command) = {
    component: "kinds.v1.LedgerState"
    emits: ["kinds.v1.Posted", "kinds.v1.Noted"]
    fact: true
    emits_cardinality: EMITS_CARDINALITY_OPTIONAL
  };
}

// A fact, MANY.
message Swept {
  option (io.angzarr.v1.command) = {
    component: "kinds.v1.LedgerState"
    emits: ["kinds.v1.Posted", "kinds.v1.Noted"]
    fact: true
    emits_cardinality: EMITS_CARDINALITY_MANY
  };
}

enum Tone {
  TONE_UNSPECIFIED = 0;
  TONE_LOUD = 1;
}

message Note {
  string text = 1;
}

message PostRefused {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_CLOSED = 1;
    REASON_OVER_LIMIT = 2;
  }
  Reason reason = 1;
  int32 small = 2;
  int64 big = 3;
  uint32 count = 4;
  uint64 total = 5;
  string text = 6;
  bytes data = 7;
  bool flag = 8;
  double ratio = 9;
  float share = 10;
  Tone tone = 11;
  optional int64 limit = 12;
  optional Tone maybe = 13;
  Note note = 14;
  repeated int32 list = 15;
  map<string, int32> table = 16;
}

// A `reason` of an enum not nested in it: an arg, not the key's.
message Unreasoned {
  Tone reason = 1;
}

// A repeated Reason: neither the key's nor an arg.
message Listed {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_FULL = 1;
  }
  repeated Reason reason = 1;
}

// A nested Reason held under another name: an arg, not the key's.
message Elsewhere {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_AWAY = 1;
  }
  Reason why = 1;
}

// A nested enum of another name held as `reason`: an arg, not the key's.
message Mislabeled {
  enum Cause {
    CAUSE_UNSPECIFIED = 0;
    CAUSE_LATE = 1;
  }
  Cause reason = 1;
}

// A second domain, a source of the projector.
message AuditState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "audit"
  };
}

message Audit {
  option (io.angzarr.v1.command) = {
    component: "kinds.v1.AuditState"
    emits: "kinds.v1.Audited"
  };
}

message Audited {
  option (io.angzarr.v1.event) = {component: "kinds.v1.AuditState"};
  option (io.angzarr.v1.event) = {
    component: "kinds.v1.LedgerView"
    domain: "audit"
  };
}

// One projector of both domains.
message LedgerView {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_PROJECTOR
    input_domains: ["ledger", "audit"]
  };
  int64 seen = 1;
}

// Each Noted on the ledger audits the same root.
message LedgerAuditPolicy {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_POLICY
    input_domain: "ledger"
    output_domain: "audit"
  };
}
