syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/examples/v1/cards.proto";
import "io/angzarr/v1/options.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/examples/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// Player domain ("player") — the bot that plays a seat
// =============================================================================
//
// The player aggregate (Python) decides what a seat does on its turn. It is
// an aggregate, not a policy: it keeps state of its own (what it has seen),
// which a later model (PyTorch) learns from. Owner ruling, 2026-10-28
// (decision 14.38); the wallet, which was the "player" before, is
// wallet.proto. A person's player and their wallet share one root, the
// player_root the table carries for the seat.
//
// The flow (policies.proto):
//   table  TurnStarted   policy-table-player -> player DecideMove   (root = TurnStarted.player_root)
//   player MoveDecided   policy-player-table -> table  Hit | Stand | DoubleDown   (root = MoveDecided.table_root)
// The table asks again (a new TurnStarted) after every action that leaves a
// decision to make, so the loop runs until the hand stands, busts or is
// doubled, and the turn passes on.
//
// The player sees only what any player at the table sees: its hand, the
// dealer's up-card and its own stack and wager. Never the dealer's hole card
// or the shoe (the table's "no peeking" guarantee, R8 in
// docs/design/blackjack-latest-proto-rulings.md).
//
// No registration: a player's stream starts at its first DecideMove (an
// aggregate decides on an empty stream as on any other), so nothing has to
// open it before it is seated.
//
// Rejections: none. A player always decides; DecideMove names no refuses.
// Conflict resolution: PlayerState lists no COMMUTATIVE; DecideMove is a
// reaction command (no Handling; the player stamps its own head), so it is
// never stale.

// -----------------------------------------------------------------------------
// Commands — from policy-table-player
// -----------------------------------------------------------------------------

// Decide the move of a seat whose turn it is: the hand as it stands, the
// dealer's up-card and what doubling needs. Built from the table's
// TurnStarted, field for field (the policy looks nothing up).
message DecideMove {
  option (io.angzarr.v1.command) = {
    component: "io.angzarr.examples.v1.PlayerState"
    emits: "io.angzarr.examples.v1.MoveDecided"
  };
  bytes table_root = 1; // The table asking (TurnStarted's own stream root)
  uint32 round = 2;
  int32 seat = 3;
  repeated Card cards = 4; // The hand, in the order dealt
  uint32 total = 5; // Its value (AHR-2)
  bool soft = 6;
  Card dealer_up = 7;
  bool can_double = 8; // First two cards and a stack at least the wager (AHR-10)
  int64 stack = 9; // The seat's stack, wager excluded
  int64 wager = 10; // The seat's wager this round
}

// -----------------------------------------------------------------------------
// Events
// -----------------------------------------------------------------------------

// What a seat does on its turn (AHR-10).
enum MoveAction {
  MOVE_ACTION_UNSPECIFIED = 0;
  MOVE_ACTION_HIT = 1;
  MOVE_ACTION_STAND = 2;
  MOVE_ACTION_DOUBLE_DOWN = 3; // Only when the DecideMove said can_double
}

// The player's decision. policy-player-table turns it into Hit, Stand or
// DoubleDown{seat} for table_root. It copies from the DecideMove everything
// the decision used (cards, total, soft, dealer_up), so the player's state
// is rebuilt from its events alone (hands_seen counts the decisions on a
// two-card hand) and each event is a self-describing (state, action) row.
// Owner ruling, 2026-10-29 (decision 14.38, amended).
message MoveDecided {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.PlayerState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.PlayerTablePolicy"
    domain: "player"
  };
  bytes table_root = 1; // The policy's target root (a policy never looks one up)
  uint32 round = 2;
  int32 seat = 3;
  MoveAction action = 4;
  repeated Card cards = 5; // The hand decided on, as DecideMove.cards
  uint32 total = 6; // As DecideMove.total
  bool soft = 7; // As DecideMove.soft
  Card dealer_up = 8; // As DecideMove.dealer_up
}

// -----------------------------------------------------------------------------
// State
// -----------------------------------------------------------------------------

// The PlayerAggregate. Minimal for now; a model's inputs (the hands seen and
// their outcomes, a view of the bankroll) are added as fields when the model
// needs them.
message PlayerState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "player"
    name: "PlayerAggregate"
  };
  uint64 decisions = 1; // MoveDecided events recorded
  uint64 hands_seen = 2; // Decisions taken on a two-card hand: one per hand played
}
