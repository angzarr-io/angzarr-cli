syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/v1/options.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/examples/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// Policies — stateless translators between the table, the wallet and the
// player
// =============================================================================
//
// A policy has no state, so each is declared on an empty marker message. Its
// reactions are wired by the (event) entries on the events it consumes.
// There is one policy per (source domain, destination domain) pair (decision
// 14.23). Every policy names its target root from a field of the source
// event, never from a lookup, for every target (decision 14.36, as
// amended), and emits reaction commands: they carry no Handling, the
// destination stamps its own head, and redelivery is deduplicated on the
// command id derived from the triggering event.
//
// The buy-in's four policies are declared beside the PM, in buy_in.proto:
// policy-buy-in-wallet and policy-buy-in-table (from the PM's "buy-in"
// domain, emitting commands) and policy-table-buy-in and policy-wallet-buy-in
// (into "buy-in", emitting commands to the PM, which is a domain and
// subscribes to nothing; decision 14.31).
//
// Two reactions of the earlier spec are not part of this port:
// policy-wallet-table (top-ups, whose refusal was compensated back to the
// wallet) and the table -> wallet settlement reaction (which injected facts
// into the wallet; if restored, it is part of policy-table-wallet). Both
// wait on rulings in docs/design/blackjack-latest-proto-rulings.md.

// policy-table-wallet: the one policy for the table -> wallet pair (it was
// policy-table-player before the wallet's rename, decision 14.38). On
// RoundSettled, for each outcome in seat order, it emits to that outcome's
// player_root (the wallet's root) one RecordRoundResult{table_root, round,
// wager, net} followed by one AwardLoyaltyPoints{table_root, round, points
// = wager}. What the wallet does with an award for a wallet that never
// enrolled waits on a ruling: under the latest contract a refused reaction
// command is dead-lettered.
message TableWalletPolicy {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_POLICY
    input_domain: "table"
    output_domain: "wallet"
  };
}

// policy-table-player (Rust): the one policy for the table -> player pair
// (decision 14.38). On TurnStarted it emits one DecideMove to the seat's
// player, root = TurnStarted.player_root, carrying table_root (the event's
// own stream root), round, seat, the hand's cards, total and soft,
// dealer_up, can_double, stack and wager, unchanged. It forwards nothing
// else: never the dealer's hole card or the shoe (R8).
message TablePlayerPolicy {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_POLICY
    input_domain: "table"
    output_domain: "player"
  };
}

// policy-player-table (Rust): the one policy for the player -> table pair
// (decision 14.38). On MoveDecided it emits to root = MoveDecided.table_root
// one Hit{seat}, Stand{seat} or DoubleDown{seat}, by action
// (MOVE_ACTION_HIT, _STAND, _DOUBLE_DOWN). An action it does not know
// (MOVE_ACTION_UNSPECIFIED) is a player bug: the policy fails, and the
// trigger is dead-lettered and alerted. A refusal of its command passes
// through to the player as CommandRefused; the player defines no
// on_refused handler for Hit, Stand or DoubleDown (a refused move is a bug,
// table.proto), so it is dead-lettered and alerted.
message PlayerTablePolicy {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_POLICY
    input_domain: "player"
    output_domain: "table"
  };
}
