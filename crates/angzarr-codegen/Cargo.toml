[package]
name = "angzarr-codegen"
version = "0.1.0"
description = "angzarr's generator core: descriptors in, generated source out. Pure: no I/O."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
angzarr-embedded-diagnostic.workspace = true
prettyplease = "0.3.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
prost-reflect = "0.16"
quote = "1.0.47"
serde.workspace = true
syn = { version = "3.0.9", features = ["full"] }
toml.workspace = true

[dev-dependencies]
angzarr-proto.workspace = true
angzarr-fmt.workspace = true
prost = "0.14"

[lints]
workspace = true
