[package]
name = "angzarr-codegen"
version = "0.1.0"
description = "angzarr's generator core: descriptors in, generated source out. Pure: no I/O."
edition.workspace = true
# BSD-3-Clause, not the workspace's AGPL: angzarr-build, which application
# build scripts depend on, depends on this crate. See LICENSE beside it.
license = "BSD-3-Clause"
publish.workspace = true
rust-version.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
prettyplease = "0.3.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
prost-reflect = "0.16"
quote = "1.0.47"
# The host config's schema (angzarr.yaml), the one angzarr-embedded-host
# runs, to lint it, seed it and derive an application from it.
angzarr-embedded-host-config.workspace = true
serde.workspace = true
syn = { version = "3.0.9", features = ["full"] }
# An application's manifest (Cargo.toml), read for its domain crate.
toml = "0.9"

[dev-dependencies]
angzarr-proto.workspace = true
angzarr-fmt.workspace = true
prost = "0.14"

[lints]
workspace = true
