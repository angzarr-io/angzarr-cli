[package]
name = "angzarr-cli"
version = "0.1.0"
description = "The angzarr command line."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "angzarr"
path = "src/main.rs"

[dependencies]
angzarr-cli-adapters.workspace = true
angzarr-cli-app.workspace = true
angzarr-cli-core.workspace = true
angzarr-fmt.workspace = true
angzarr-fmt-clap.workspace = true
