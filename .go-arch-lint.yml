# Architecture rules for the angzarr CLI, checked by go-arch-lint
# (`just archlint`; pre-commit and CI run it).
#
# Layers, top to bottom:
#   main      the binary entry point
#   cmd       cobra commands: flag/parameter parsing, protoc plugin I/O
#   registry  codegen/emit/builtin: registers the built-in emitters
#   emit-*    one language emitter per package (codegen/emit/<lang>)
#   core      codegen: options, component model, lint, orchestration
#
# The core is language-neutral: it never imports an emitter (emitters reach
# it through codegen.Register, called from the registry). Each emitter
# depends on the core only, never on another emitter, so languages can be
# deleted one at a time. Third-party libraries are allowed per layer: cobra
# and viper only in cmd, protobuf below main.
version: 3

allow:
  depOnAnyVendor: false

# Generated output (generate-check's _gen) and the angzarr-project
# submodule are not CLI code.
exclude:
  - _gen
  - angzarr-project

# Tests are wiring-level: core tests register the built-in emitters to drive
# generation end to end.
excludeFiles:
  - "^.*_test\\.go$"

vendors:
  protobuf: { in: google.golang.org/protobuf/** }
  cobra: { in: github.com/spf13/cobra }
  viper: { in: github.com/spf13/viper }

components:
  main: { in: . }
  cmd: { in: cmd }
  registry: { in: codegen/emit/builtin }
  emit-cpp: { in: codegen/emit/cpp }
  emit-csharp: { in: codegen/emit/csharp }
  emit-go: { in: codegen/emit/golang }
  emit-java: { in: codegen/emit/java }
  emit-python: { in: codegen/emit/python }
  emit-typescript: { in: codegen/emit/typescript }
  core: { in: codegen }
  testfixtures: { in: codegen/internal/codegentest }

deps:
  main:
    mayDependOn: [cmd]

  cmd:
    mayDependOn: [core, registry]
    canUse: [cobra, viper, protobuf]

  registry:
    mayDependOn:
      - core
      - emit-cpp
      - emit-csharp
      - emit-go
      - emit-java
      - emit-python
      - emit-typescript

  emit-cpp: { mayDependOn: [core], canUse: [protobuf] }
  emit-csharp: { mayDependOn: [core], canUse: [protobuf] }
  emit-go: { mayDependOn: [core], canUse: [protobuf] }
  emit-java: { mayDependOn: [core], canUse: [protobuf] }
  emit-python: { mayDependOn: [core], canUse: [protobuf] }
  emit-typescript: { mayDependOn: [core], canUse: [protobuf] }

  # deepScan counts an implementation passed into a component's function as
  # that component depending on the implementation's component. The registry
  # hands every emitter to codegen.Register through the codegen.Emitter
  # interface — that injection is how the core stays free of emitter imports
  # — so the core is held to import rules only.
  core:
    deepScan: false
    canUse: [protobuf]

  testfixtures:
    canUse: [protobuf]
