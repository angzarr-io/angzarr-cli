[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
authors = ["Benjamin Abbitt"]
rust-version = "1.96"
license = "AGPL-3.0-only WITH LicenseRef-angzarr-cli-generated-output-exception"
publish = false

[workspace.dependencies]
angzarr-build = { path = "crates/angzarr-build" }
angzarr-codegen = { path = "crates/angzarr-codegen" }
angzarr-fmt = { path = "crates/angzarr-fmt" }
# angzarr core's localizable-error trait, pinned by full commit at the rev
# angzarr-embedded's crates name; bumps are deliberate commits.
angzarr-diagnostic = { git = "https://github.com/angzarr-io/angzarr", rev = "2681dab885c8a3f138a0964f4d6b628d2480963f" }
# angzarr-embedded is pinned by full commit; bumps are deliberate commits.
angzarr-embedded-host-config = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "71c8ebca3cfff5b7d4e1ae40c3fba25531820a05" }
angzarr-embedded-host = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "71c8ebca3cfff5b7d4e1ae40c3fba25531820a05" }
# angzarr's wire contract, pinned by full commit; bumps are deliberate commits.
angzarr-proto = { version = "0.1", git = "https://github.com/angzarr-io/angzarr", rev = "2681dab885c8a3f138a0964f4d6b628d2480963f" }
# The local-process transport's keys (a child's failures) and their English
# (decision 14.64), at angzarr-proto's core rev.
angzarr-proto-transport-embedded = { git = "https://github.com/angzarr-io/angzarr", rev = "2681dab885c8a3f138a0964f4d6b628d2480963f" }
# The tests' scratch directories (angzarr core's one guard, std alone), a
# dev-dependency only, at the core rev the crates above are.
angzarr-test-dir = { git = "https://github.com/angzarr-io/angzarr", rev = "2681dab885c8a3f138a0964f4d6b628d2480963f" }
clap = { version = "4.5", features = ["derive"] }
fluent-bundle = "0.15"
fluent-syntax = "0.11"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a struct's field order in every rendered format.
serde_json = { version = "1", features = ["preserve_order"] }
unic-langid = "0.9"

# Every crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
# Zero-width and other invisible characters in source: never intended.
invisible_characters = "deny"
# A literal in another normalization form than NFC reads the same as its NFC
# twin and compares unequal.
unicode_not_nfc = "deny"
# Non-ASCII in a literal is written as an escape, so what the code holds is
# visible.
non_ascii_literal = "deny"
# Complexity (architecture-fixes G2; taskloom's gate), at clippy's defaults
# (cognitive complexity 25, 100 lines) except nesting, whose threshold is in
# clippy.toml. `just lint` denies warnings, and pre-commit runs it.
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
