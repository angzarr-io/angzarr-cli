[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
angzarr-build = { path = "crates/angzarr-build" }
angzarr-codegen = { path = "crates/angzarr-codegen" }
angzarr-fmt = { path = "crates/angzarr-fmt" }
angzarr-fmt-clap = { path = "crates/angzarr-fmt-clap" }
# angzarr-embedded is pinned by full commit; bumps are deliberate commits.
angzarr-embedded-diagnostic = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
angzarr-embedded-yaml = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
# angzarr's wire contract, pinned by full commit; bumps are deliberate commits.
angzarr-proto = { version = "0.1", git = "https://github.com/angzarr-io/angzarr-project", rev = "55eab0f7225ecd5ed63aa74a766d2f16b2735be2" }
clap = { version = "4.5", features = ["derive"] }
fluent-bundle = "0.15"
fluent-syntax = "0.11"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a struct's field order in every rendered format.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
unic-langid = "0.9"

# Every crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
# Zero-width and other invisible characters in source: never intended.
invisible_characters = "deny"
# A literal in another normalization form than NFC reads the same as its NFC
# twin and compares unequal.
unicode_not_nfc = "deny"
# Non-ASCII in a literal is written as an escape, so what the code holds is
# visible.
non_ascii_literal = "deny"
