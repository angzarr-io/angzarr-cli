# Git hooks, managed by lefthook (`just hooks-install`, once per clone).
# https://github.com/evilmartians/lefthook
#
# Bypass: none — fix the finding instead.

# Plant the in-submodule pre-commit guard in .git/modules/<name>/hooks/
# (angzarr-project/submodule.just) after checkouts and merges.
#
# A fresh clone or `git worktree add` runs post-checkout before any
# submodule is checked out: angzarr-project/submodule.just is not there, so
# the justfile's `import?` brings no `install-submodule-hooks`, and there is
# no submodule checkout to guard either. The step says so, and how to
# install the guard once the submodules are checked out; with
# submodule.just there, the recipe runs and its failure fails the hook.
post-checkout:
  commands:
    install-submodule-hooks:
      run: &install-submodule-hooks >-
        if [ -f angzarr-project/submodule.just ]; then just install-submodule-hooks;
        else echo "no submodule guard installed: angzarr-project is not checked out (git submodule update --init, then just install-submodule-hooks)";
        fi

post-merge:
  commands:
    install-submodule-hooks:
      run: *install-submodule-hooks

pre-commit:
  # One at a time, stopping at the first failure.
  piped: true
  commands:
    check-submodules-clean:
      # A submodule with uncommitted edits or untracked files; a pointer-only
      # bump passes.
      priority: 1
      run: just check-submodules-clean
    fmt:
      priority: 2
      glob: "*.rs"
      run: just fmt
      stage_fixed: true
    lint:
      # clippy -D warnings (the complexity gate among them: Cargo.toml's
      # [workspace.lints.clippy] and clippy.toml) and the rustfmt check.
      priority: 3
      run: just lint
    tests:
      # Red tests are allowed off the protected branches (origin's default
      # branch and the justfile's PROTECTED_BRANCHES: the integration line
      # poc/local-wiring), with a warning (`just test-commit`).
      priority: 4
      run: just test-commit

# No mutation testing in any hook: it runs while tests are written and judged
# (`just mutants-staged`), at the end of an unattended run, and in the
# scheduled CI full pass (`just mutants-all`). `just push-check` runs each
# pushed commit's tests in a tree of its own (the justfile says how). git's
# pushed refs are on stdin, and {1} is the remote's name. lefthook skips a
# pre-push command when it finds no files changed between HEAD and the
# remote, which says nothing of the refs pushed; a `{files}` in `run` turns
# that off, so `files` names one that is always there, and push-check
# ignores it.
pre-push:
  commands:
    push-check:
      use_stdin: true
      files: echo justfile
      run: just push-check {1} {files}
