# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install
# Bypass: git commit --no-verify (or LEFTHOOK=0 git commit)

# Plant the in-submodule pre-commit guard in .git/modules/<name>/hooks/
# after every checkout/merge — an editor inside the submodule must not
# sneak a commit past us (detached HEAD = silent data loss).
post-checkout:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

post-merge:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

pre-commit:
  parallel: false
  commands:
    # Block the parent commit if any submodule has uncommitted edits or
    # untracked files. Pointer-only bumps still pass.
    # git exports GIT_DIR/GIT_INDEX_FILE (absolute, pointing at the parent
    # repo) to hooks run from a linked worktree; inherited by the recipe's
    # `git -C <submodule> status`, they make it diff the submodule's files
    # against the parent's index. Clearing them scopes each git call to the
    # repository its -C path names.
    check-submodules-clean:
      run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE just check-submodules-clean
    fmt:
      run: just fmt-fix
      stage_fixed: true
    test:
      run: just test
